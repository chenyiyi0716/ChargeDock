<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>ChargeDock · 应用图标方案 v2</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI Variable Display","Segoe UI",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#e9e6e1;color:#1b1b1b;padding:44px 40px 60px}
  .page{max-width:1200px;margin:0 auto}
  h1{font-size:26px;font-weight:650;letter-spacing:-.02em}
  .sub{margin-top:8px;color:#6b6b6b;font-size:13.5px;line-height:1.6}
  .row{display:flex;gap:34px;margin-top:28px;flex-wrap:wrap}
  .card{width:200px;display:flex;flex-direction:column;align-items:center;gap:12px}
  .icon{width:200px;height:200px;display:block;border-radius:46px;box-shadow:0 16px 36px -18px rgba(0,0,0,.45)}
  .label{font-size:13px;font-weight:600}
  .small{display:flex;gap:10px;align-items:center;margin-top:2px}
  .small svg{display:block;border-radius:12px}
  .sect{margin-top:34px}
  .sect-title{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8a8278}
  .band{border-radius:20px;padding:30px 26px;display:flex;gap:34px;flex-wrap:wrap;justify-content:center;border:1px solid rgba(0,0,0,.05)}
  .band.light{background:#f6f3ee}
  .band.dark{background:#121417;border-color:#1e2320;color:#e8ece9}
  .band.dark .label{color:#e8ece9}
</style>
</head>
<body>
<div class="page">
  <h1>ChargeDock · 应用图标方案 v2</h1>
  <p class="sub">第二批 5 个新方向（与 v1 不重复）。统一 512×512 圆角磁贴，附浅色/深色背景与 48 / 32px 小尺寸辨识度检查。</p>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <linearGradient id="gF" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#151b23"/><stop offset="1" stop-color="#05070a"/></linearGradient>
      <linearGradient id="gG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#115e59"/></linearGradient>
      <linearGradient id="gH" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
      <linearGradient id="gI" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121820"/><stop offset="1" stop-color="#05070a"/></linearGradient>
      <linearGradient id="gJ" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#065f46"/></linearGradient>
      <clipPath id="dropClip"><path d="M256 104 C 196 200 152 262 152 318 A 104 104 0 0 0 360 318 C 360 262 316 200 256 104 Z"/></clipPath>
      <clipPath id="batClip"><rect x="131" y="207" width="210" height="106" rx="28"/></clipPath>

      <!-- F 电量条 -->
      <symbol id="icF" viewBox="0 0 512 512">
        <rect width="512" height="512" rx="116" fill="url(#gF)"/>
        <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="3"/>
        <rect x="116" y="146" width="280" height="46" rx="23" fill="#22c55e"/>
        <rect x="116" y="233" width="206" height="46" rx="23" fill="#f59e0b"/>
        <rect x="116" y="320" width="124" height="46" rx="23" fill="#ef4444"/>
      </symbol>

      <!-- G 能量水滴 -->
      <symbol id="icG" viewBox="0 0 512 512">
        <rect width="512" height="512" rx="116" fill="url(#gG)"/>
        <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="3"/>
        <path d="M256 104 C 196 200 152 262 152 318 A 104 104 0 0 0 360 318 C 360 262 316 200 256 104 Z" fill="#ffffff" opacity=".16"/>
        <rect x="120" y="304" width="272" height="170" fill="#ffffff" clip-path="url(#dropClip)"/>
        <path d="M256 104 C 196 200 152 262 152 318 A 104 104 0 0 0 360 318 C 360 262 316 200 256 104 Z" fill="none" stroke="#ffffff" stroke-width="26" stroke-linejoin="round"/>
      </symbol>

      <!-- H 电源符号 -->
      <symbol id="icH" viewBox="0 0 512 512">
        <rect width="512" height="512" rx="116" fill="url(#gH)"/>
        <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-width="3"/>
        <path d="M197 154 A118 118 0 1 0 315 154" fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round"/>
        <path d="M256 96 V 226" fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round"/>
      </symbol>

      <!-- I 同心环 -->
      <symbol id="icI" viewBox="0 0 512 512">
        <rect width="512" height="512" rx="116" fill="url(#gI)"/>
        <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="3"/>
        <circle cx="256" cy="256" r="172" fill="none" stroke="#22c55e" stroke-width="18" opacity=".32"/>
        <circle cx="256" cy="256" r="120" fill="none" stroke="#22c55e" stroke-width="18" opacity=".6"/>
        <circle cx="256" cy="256" r="70" fill="none" stroke="#34d399" stroke-width="18"/>
        <circle cx="256" cy="256" r="20" fill="#34d399"/>
      </symbol>

      <!-- J 电池闪电 -->
      <symbol id="icJ" viewBox="0 0 512 512">
        <rect width="512" height="512" rx="116" fill="url(#gJ)"/>
        <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-width="3"/>
        <rect x="120" y="196" width="232" height="128" rx="38" fill="#ffffff"/>
        <rect x="362" y="232" width="28" height="56" rx="14" fill="#ffffff"/>
        <path d="M288 196 L212 312 H258 L236 384 L316 262 H270 Z" fill="url(#gJ)" clip-path="url(#batClip)"/>
      </symbol>
    </defs>
  </svg>

  <div class="sect">
    <div class="sect-title">浅色背景</div>
    <div class="band light">
      <div class="card"><svg class="icon"><use href="#icF"/></svg><span class="label">F · 电量条</span><div class="small"><svg width="48" height="48"><use href="#icF"/></svg><svg width="32" height="32"><use href="#icF"/></svg></div></div>
      <div class="card"><svg class="icon"><use href="#icG"/></svg><span class="label">G · 能量水滴</span><div class="small"><svg width="48" height="48"><use href="#icG"/></svg><svg width="32" height="32"><use href="#icG"/></svg></div></div>
      <div class="card"><svg class="icon"><use href="#icH"/></svg><span class="label">H · 电源符号</span><div class="small"><svg width="48" height="48"><use href="#icH"/></svg><svg width="32" height="32"><use href="#icH"/></svg></div></div>
      <div class="card"><svg class="icon"><use href="#icI"/></svg><span class="label">I · 同心环</span><div class="small"><svg width="48" height="48"><use href="#icI"/></svg><svg width="32" height="32"><use href="#icI"/></svg></div></div>
      <div class="card"><svg class="icon"><use href="#icJ"/></svg><span class="label">J · 电池闪电</span><div class="small"><svg width="48" height="48"><use href="#icJ"/></svg><svg width="32" height="32"><use href="#icJ"/></svg></div></div>
    </div>
  </div>

  <div class="sect">
    <div class="sect-title">深色背景</div>
    <div class="band dark">
      <div class="card"><svg class="icon"><use href="#icF"/></svg><span class="label">F · 电量条</span><div class="small"><svg width="48" height="48"><use href="#icF"/></svg><svg width="32" height="32"><use href="#icF"/></svg></div></div>
      <div class="card"><svg class="icon"><use href="#icG"/></svg><span class="label">G · 能量水滴</span><div class="small"><svg width="48" height="48"><use href="#icG"/></svg><svg width="32" height="32"><use href="#icG"/></svg></div></div>
      <div class="card"><svg class="icon"><use href="#icH"/></svg><span class="label">H · 电源符号</span><div class="small"><svg width="48" height="48"><use href="#icH"/></svg><svg width="32" height="32"><use href="#icH"/></svg></div></div>
      <div class="card"><svg class="icon"><use href="#icI"/></svg><span class="label">I · 同心环</span><div class="small"><svg width="48" height="48"><use href="#icI"/></svg><svg width="32" height="32"><use href="#icI"/></svg></div></div>
      <div class="card"><svg class="icon"><use href="#icJ"/></svg><span class="label">J · 电池闪电</span><div class="small"><svg width="48" height="48"><use href="#icJ"/></svg><svg width="32" height="32"><use href="#icJ"/></svg></div></div>
    </div>
  </div>
</div>
</body>
</html>
